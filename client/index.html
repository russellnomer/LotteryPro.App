    <!-- Google AdSense - Replace ca-pub-XXXXXXXXXXXXXXXX with your Publisher ID -->

    <script>
      // Set AdSense Publisher ID from environment
      window.ADSENSE_PUBLISHER_ID = 'GOOGLE_ADSENSE_PUBLISHER_ID_PLACEHOLDER';
      
      // Only load AdSense in production to avoid development errors
      if (location.hostname !== 'localhost' && !location.hostname.includes('replit.dev')) {

        script.async = true;
        script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + window.ADSENSE_PUBLISHER_ID;
        script.crossOrigin = 'anonymous';
        document.head.appendChild(script);
      }
    </script>
