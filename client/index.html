<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LotteryPro - Statistical Lottery Analysis</title>
    
    <!-- Google AdSense - Loaded securely via server endpoint -->
    <script>
      // Secure AdSense loading - no sensitive data exposed to client
      window.loadAdSense = async function() {
        if (location.hostname === 'localhost' || location.hostname.includes('replit.dev')) {
          // Development mode - no ads loaded
          return;
        }
        
        try {
          // Fetch AdSense config securely from server
          const response = await fetch('/api/adsense-config');
          const config = await response.json();
          
          if (config.enabled) {
            const script = document.createElement('script');
            script.async = true;
            script.src = config.scriptUrl;
            script.crossOrigin = 'anonymous';
            document.head.appendChild(script);
          }
        } catch (error) {
          console.log('AdSense loading skipped');
        }
      };
      
      // Load AdSense when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.loadAdSense);
      } else {
        window.loadAdSense();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
