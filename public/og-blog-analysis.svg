<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a2f6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1f4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Grid lines -->
  <line x1="0" y1="126" x2="1200" y2="126" stroke="#2d4a7a" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="#2d4a7a" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="378" x2="1200" y2="378" stroke="#2d4a7a" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="504" x2="1200" y2="504" stroke="#2d4a7a" stroke-width="1" opacity="0.4"/>
  <line x1="240" y1="0" x2="240" y2="630" stroke="#2d4a7a" stroke-width="1" opacity="0.4"/>
  <line x1="480" y1="0" x2="480" y2="630" stroke="#2d4a7a" stroke-width="1" opacity="0.4"/>
  <line x1="720" y1="0" x2="720" y2="630" stroke="#2d4a7a" stroke-width="1" opacity="0.4"/>
  <line x1="960" y1="0" x2="960" y2="630" stroke="#2d4a7a" stroke-width="1" opacity="0.4"/>

  <!-- Bar chart decoration (right side) -->
  <rect x="760" y="340" width="48" height="180" rx="4" fill="#3b82f6" opacity="0.25"/>
  <rect x="828" y="290" width="48" height="230" rx="4" fill="#3b82f6" opacity="0.35"/>
  <rect x="896" y="240" width="48" height="280" rx="4" fill="#3b82f6" opacity="0.45"/>
  <rect x="964" y="200" width="48" height="320" rx="4" fill="#60a5fa" opacity="0.55"/>
  <rect x="1032" y="150" width="48" height="370" rx="4" fill="#60a5fa" opacity="0.65"/>
  <rect x="1100" y="100" width="48" height="420" rx="4" fill="#93c5fd" opacity="0.5"/>

  <!-- Trend line -->
  <polyline points="760,340 808,290 876,240 944,200 1012,150 1080,100" stroke="#fbbf24" stroke-width="3" fill="none" opacity="0.8" filter="url(#glow)"/>
  <circle cx="760" cy="340" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="808" cy="290" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="876" cy="240" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="944" cy="200" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="1012" cy="150" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="1080" cy="100" r="5" fill="#fbbf24" opacity="0.9"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)" />

  <!-- Category pill -->
  <rect x="72" y="160" width="150" height="36" rx="18" fill="#3b82f6" opacity="0.9"/>
  <text x="147" y="184" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">ANALYSIS</text>

  <!-- Main headline -->
  <text x="72" y="265" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="white" letter-spacing="-1">Number</text>
  <text x="72" y="345" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="white" letter-spacing="-1">Frequency</text>
  <text x="72" y="425" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="url(#accent)" letter-spacing="-1">Analysis</text>

  <!-- Subtitle -->
  <text x="72" y="480" font-family="Arial, sans-serif" font-size="22" fill="#93c5fd" opacity="0.9">Data-driven lottery number research</text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="#0f1f4a" opacity="0.8"/>
  <text x="72" y="607" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fbbf24">LotteryPro</text>
  <text x="200" y="607" font-family="Arial, sans-serif" font-size="18" fill="#93c5fd" opacity="0.8">· Educational Lottery Analysis Platform</text>
  <text x="1128" y="607" font-family="Arial, sans-serif" font-size="16" fill="#93c5fd" opacity="0.6" text-anchor="end">lotterypro.app</text>
</svg>
